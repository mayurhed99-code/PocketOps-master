spring.application.name=backend

server.port=${POCKETOPS_SERVER_PORT:8080}

spring.datasource.url=${POCKETOPS_DB_URL:jdbc:mysql://localhost:3306/pocketops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${POCKETOPS_DB_USERNAME:pocketops}
spring.datasource.password=${POCKETOPS_DB_PASSWORD:pocketops_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

pocketops.auth.jwt.issuer=${POCKETOPS_AUTH_JWT_ISSUER:pocketops}
pocketops.auth.jwt.secret=${POCKETOPS_AUTH_JWT_SECRET:replace-with-secure-32-byte-secret}
pocketops.auth.jwt.access-token-minutes=${POCKETOPS_AUTH_ACCESS_MINUTES:15}
pocketops.auth.jwt.refresh-token-days=${POCKETOPS_AUTH_REFRESH_DAYS:30}
pocketops.agent.public-base-url=${POCKETOPS_PUBLIC_BASE_URL:http://localhost:8080}
pocketops.agent.grpc.host=${POCKETOPS_AGENT_GRPC_HOST:localhost}
pocketops.agent.grpc.port=${POCKETOPS_AGENT_GRPC_PORT:9090}
pocketops.agent.grpc.tls.enabled=${POCKETOPS_AGENT_GRPC_TLS_ENABLED:false}
pocketops.agent.grpc.tls.cert-chain-path=${POCKETOPS_AGENT_GRPC_TLS_CERT_CHAIN_PATH:}
pocketops.agent.grpc.tls.private-key-path=${POCKETOPS_AGENT_GRPC_TLS_PRIVATE_KEY_PATH:}
pocketops.agent.registration-token-minutes=${POCKETOPS_AGENT_REGISTRATION_TOKEN_MINUTES:30}
pocketops.agent.heartbeat-timeout-seconds=${POCKETOPS_AGENT_HEARTBEAT_TIMEOUT_SECONDS:45}
